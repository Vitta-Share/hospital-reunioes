{% extends "email_base.html" %}

{% block title %}Aviso do Canal de Conduta, Hospital São Matheus{% endblock %}

{% block header_subtitle %}Canal de Conduta{% endblock %}

{% block body %}
  <p style="color:#475569;font-size:14px;line-height:1.6;margin:0 0 16px;">
    {{ frase }}
  </p>

  <table width="100%" cellpadding="0" cellspacing="0" style="margin-top:8px;">
    <tr>
      <td align="center">
        <a href="{{ link }}"
           style="display:inline-block;background:linear-gradient(135deg,#2B2E7E,#2558A0);color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;padding:13px 36px;border-radius:10px;">
          Abrir no aplicativo
        </a>
      </td>
    </tr>
  </table>
{% endblock %}
