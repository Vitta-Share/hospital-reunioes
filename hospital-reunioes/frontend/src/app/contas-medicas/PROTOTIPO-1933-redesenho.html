  --sombra:0 10px 25px -5px rgba(0,0,0,.08),0 8px 10px -6px rgba(0,0,0,.08);
  --fonte:"HP Simplified",system-ui,-apple-system,"Segoe UI",sans-serif;
  --t-1:13px; --t0:15px; --t1:17px; --t2:20px; --t3:24px; --t4:32px; --t5:44px;
}
html,body{height:100%}
body{background:var(--fundo);color:var(--texto);font-family:var(--fonte);font-size:var(--t1);line-height:1.4}
*{box-sizing:border-box}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;text-transform:uppercase;letter-spacing:.02em;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.caixa{text-transform:uppercase;letter-spacing:.02em}

/* casca */
.casca{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100%}
.lateral{background:var(--papel);border-right:1px solid var(--linha);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.lateral .marca{font-size:var(--t0);color:var(--marinho);padding:4px 10px 16px;line-height:1.2}
.lateral span.item{display:block;padding:8px 10px;border-radius:4px;font-size:var(--t0);color:var(--texto-2);text-transform:uppercase;letter-spacing:.02em}
.lateral span.item.ativo{background:var(--gelo);color:var(--marinho);font-weight:700}
.miolo{min-width:0;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:900px){.miolo{padding-left:28px;padding-right:28px}}
@media(max-width:899px){.casca{grid-template-columns:minmax(0,1fr)}.lateral{display:none}}

.subnav{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--linha);margin-bottom:20px}
.subnav button{padding:10px 14px;font-size:var(--t0);color:var(--texto-2);border-bottom:2px solid transparent}
.subnav button.ativo{color:var(--marinho);border-color:var(--marinho);font-weight:700}
.subnav button[disabled]{opacity:.55;cursor:default}

/* dica no hover */
[data-dica]{position:relative}
[data-dica]:hover::after,[data-dica]:focus-visible::after{content:attr(data-dica);position:absolute;z-index:60;bottom:calc(100% + 8px);left:0;width:max-content;max-width:300px;background:var(--marinho-escuro);color:#fff;padding:8px 11px;border-radius:6px;font-size:var(--t-1);line-height:1.35;text-transform:none;letter-spacing:0;font-weight:400;white-space:normal;text-align:left;box-shadow:var(--sombra);pointer-events:none}
[data-dica].dica-dir:hover::after{left:auto;right:0}
.legenda{display:none;font-size:var(--t-1);color:var(--texto-2);text-transform:none;letter-spacing:0;font-weight:400}
.com-legendas .legenda{display:block}

/* barra de ferramentas da fila */
.ferramentas{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.busca{position:relative;flex:1 1 340px;min-width:0;max-width:640px}
.busca svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--texto-2)}
.busca input{width:100%;height:52px;padding:0 14px 0 44px;border:1px solid var(--linha);border-radius:6px;background:var(--papel);font:inherit;font-size:var(--t2);color:var(--texto)}
.busca input::placeholder{color:#94A3B8;font-size:var(--t1)}
.busca input:focus{outline:none;border-color:var(--marinho);box-shadow:0 0 0 3px var(--gelo-forte)}
.segmento{display:inline-flex;padding:4px;border-radius:6px;background:var(--neutro-fundo)}
.segmento button{padding:9px 16px;border-radius:4px;font-size:var(--t0);color:var(--texto-2)}
.segmento button[aria-pressed="true"]{background:var(--papel);color:var(--marinho);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.botao{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:6px;font-size:var(--t0);border:1px solid var(--linha);background:var(--papel);color:var(--texto);transition:border-color .12s,background .12s}
.botao:hover{border-color:#94A3B8}
.botao.primario{background:var(--marinho);border-color:var(--marinho);color:#fff}
.botao.primario:hover{background:var(--marinho-escuro)}
.botao svg{width:18px;height:18px}
.interruptor{display:inline-flex;align-items:center;gap:8px;font-size:var(--t0);color:var(--texto-2)}
.interruptor i{width:38px;height:22px;border-radius:999px;background:#CBD5E1;position:relative;transition:background .15s}
.interruptor i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.interruptor[aria-checked="true"] i{background:var(--marinho)}
.interruptor[aria-checked="true"] i::after{left:19px}

/* esteira de etapas */
.esteira{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--linha);border-radius:8px;background:var(--papel);overflow:hidden}
.esteira button{text-align:left;padding:12px 16px;border-right:1px solid var(--linha);display:flex;flex-direction:column;gap:2px;transition:background .12s}
.esteira button:last-child{border-right:0}
.esteira button:hover{background:var(--fundo)}
.esteira button b{font-size:var(--t4);line-height:1;font-weight:700;color:var(--texto)}
.esteira button span{font-size:var(--t0);color:var(--texto-2)}
.esteira button.ativo{background:var(--marinho)}
.esteira button.ativo b,.esteira button.ativo span{color:#fff}
.esteira button.fora{background:var(--fundo)}
.esteira button.fora b{color:var(--texto-2)}
@media(max-width:700px){.esteira{grid-template-columns:repeat(2,minmax(0,1fr))}.esteira button{border-bottom:1px solid var(--linha)}}
.frase-da-etapa{margin:10px 2px 16px;min-height:1.4em}

/* continue de onde parou */
.retomar{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:20px}
.retomar button{text-align:left;text-transform:none;letter-spacing:0;background:var(--gelo);border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;transition:background .12s}
.retomar button:hover{background:var(--gelo-forte)}
.retomar .n{font-size:var(--t3);font-weight:700;color:var(--marinho)}
.retomar .p{font-size:var(--t1);color:var(--texto)}
.retomar .ir{font-size:var(--t0);color:var(--marinho);text-transform:uppercase;letter-spacing:.02em;font-weight:700}
.trilho{grid-column:1/-1;height:6px;border-radius:999px;background:#fff;overflow:hidden}
.trilho i{display:block;height:100%;background:var(--marinho);border-radius:999px}
.titulo-secao{font-size:var(--t0);color:var(--texto-2);margin:0 2px 8px;font-weight:400}

/* lista de contas */
.lista{background:var(--papel);border:1px solid var(--linha);border-radius:8px;overflow:hidden}
.cab,.linha{display:grid;grid-template-columns:minmax(220px,1.6fr) minmax(90px,.7fr) minmax(150px,1fr) minmax(150px,1fr) minmax(110px,.8fr) 150px;gap:16px;align-items:center;padding:0 20px}
.cab{height:40px;font-size:var(--t-1);color:var(--texto-2);border-bottom:1px solid var(--linha);background:var(--fundo)}
.linha{min-height:60px;border-bottom:1px solid var(--neutro-fundo);transition:background .1s}
.linha:last-child{border-bottom:0}
.linha:hover{background:var(--gelo)}
.linha .quem-e{display:flex;align-items:baseline;gap:12px;min-width:0}
.linha .n{font-size:var(--t3);font-weight:700;color:var(--texto);line-height:1}
.linha .p{font-size:var(--t1);color:var(--texto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha .apoio{font-size:var(--t0);color:var(--texto-2)}
.linha mark{background:#FFE08A;color:inherit;border-radius:2px;padding:0 1px}
.linha .acoes{display:flex;justify-content:flex-end;gap:8px}
.linha .acoes .so-no-hover{opacity:0;transition:opacity .1s}
.linha:hover .acoes .so-no-hover,.linha:focus-within .acoes .so-no-hover{opacity:1}
.mini{padding:7px 12px;border-radius:4px;font-size:var(--t-1);border:1px solid var(--linha);background:var(--papel)}
.mini:hover{border-color:#94A3B8}
.mini.forte{background:var(--marinho);border-color:var(--marinho);color:#fff}
.progresso{display:flex;align-items:center;gap:10px;font-size:var(--t0);color:var(--texto-2)}
.progresso .trilho{flex:1;background:var(--neutro-fundo);max-width:120px}
.pessoa{display:inline-flex;align-items:center;gap:8px;font-size:var(--t0)}
.pessoa i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--gelo-forte);color:var(--marinho);display:grid;place-items:center;font-size:12px;font-weight:700}
.pessoa.eu i{background:var(--marinho);color:#fff}
.pilula{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:var(--t-1);text-transform:uppercase;letter-spacing:.02em;background:var(--neutro-fundo);color:var(--neutro)}
.pilula.ok{background:var(--feito-fundo);color:var(--feito)}
.pilula.alerta{background:var(--alerta-fundo);color:var(--alerta)}
.pilula.azul{background:var(--gelo-forte);color:var(--marinho)}
.grupo{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;background:var(--fundo);border-bottom:1px solid var(--linha);border-top:1px solid var(--linha)}
.grupo:first-child{border-top:0}
.grupo h3{font-size:var(--t1);font-weight:700;color:var(--texto);text-transform:none;letter-spacing:0}
.grupo .conta-quantas{font-size:var(--t0);color:var(--texto-2);flex:1}
.confirma{padding:16px 20px;background:var(--alerta-fundo);border-bottom:1px solid var(--linha);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.confirma p{flex:1 1 380px;min-width:0;font-size:var(--t1);color:#5F370E}
.vazio{padding:48px 20px;text-align:center;color:var(--texto-2)}
.grito{margin-bottom:16px;border:2px solid var(--marinho);border-radius:8px;background:var(--papel);padding:20px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;box-shadow:var(--sombra);animation:surge .18s ease-out}
.grito .n{font-size:var(--t5);font-weight:700;color:var(--marinho);line-height:1}
.grito .p{font-size:var(--t3)}
.grito .onde{flex:1 1 260px;min-width:0;color:var(--texto-2)}
@keyframes surge{from{transform:scale(.985);opacity:.4}to{transform:none;opacity:1}}
@media(max-width:1000px){.cab{display:none}.linha{grid-template-columns:minmax(0,1fr) auto;padding:10px 16px;gap:6px 12px}.linha>.c-op,.linha>.c-per{display:none}}

.soltar{border:2px dashed #94A3B8;border-radius:8px;background:var(--papel);padding:22px;text-align:center;margin-bottom:16px;color:var(--texto-2)}
.soltar b{display:block;color:var(--texto);font-size:var(--t2);font-weight:400}

/* quadro (variante B da fila) */
.quadro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.coluna{background:var(--neutro-fundo);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.coluna header{display:flex;align-items:baseline;gap:10px;padding:6px 8px}
.coluna header h3{font-size:var(--t1);font-weight:700}
.coluna header b{font-size:var(--t3);font-weight:700;color:var(--marinho)}
.coluna .rola{display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow:auto;padding-right:2px}
.cartao{text-align:left;text-transform:none;letter-spacing:0;background:var(--papel);border:1px solid var(--linha);border-radius:6px;padding:12px 14px;display:grid;gap:6px;transition:border-color .1s,box-shadow .1s,opacity .1s}
.cartao:hover{border-color:var(--marinho);box-shadow:var(--sombra)}
.cartao .topo{display:flex;align-items:baseline;gap:10px;min-width:0}
.cartao .n{font-size:var(--t2);font-weight:700}
.cartao .p{font-size:var(--t0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartao .baixo{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:var(--t-1);color:var(--texto-2)}
.cartao.apagado{opacity:.28}
.cartao.achado{border-color:var(--marinho);box-shadow:0 0 0 3px var(--gelo-forte)}
@media(max-width:900px){.quadro{grid-template-columns:minmax(0,1fr)}}

/* conta aberta */
.voltar{font-size:var(--t0);color:var(--texto-2);text-transform:none;letter-spacing:0;padding:0;margin-bottom:10px;text-decoration:underline;text-underline-offset:3px}
.cabeca{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px;margin-bottom:16px}
.cabeca .n{font-size:var(--t5);font-weight:700;color:var(--marinho);line-height:1}
.cabeca .p{font-size:var(--t3);line-height:1.1}
.cabeca .meta{font-size:var(--t0);color:var(--texto-2);flex:1 1 260px;min-width:0}
.faixa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--linha);border-radius:8px;background:var(--papel);margin-bottom:16px}
.faixa>div{padding:12px 18px;border-right:1px solid var(--linha);min-width:0}
.faixa>div:last-child{border-right:0}
.faixa small{display:block;font-size:var(--t-1);color:var(--texto-2);text-transform:uppercase;letter-spacing:.02em}
.faixa b{font-size:var(--t4);font-weight:700;color:var(--texto);line-height:1.15}
.faixa .trilho{background:var(--neutro-fundo);margin-top:6px}
.faixa .trilho i{background:var(--feito)}
@media(max-width:700px){.faixa{grid-template-columns:minmax(0,1fr)}.faixa>div{border-right:0;border-bottom:1px solid var(--linha)}}

.mesa{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1000px){.mesa{grid-template-columns:minmax(0,1fr)}}
.roteiro{background:var(--papel);border:1px solid var(--linha);border-radius:8px;overflow:auto;max-height:calc(100vh - 230px);position:sticky;top:12px}
.roteiro .dia{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;font-size:var(--t-1);color:var(--texto-2);background:var(--fundo);border-bottom:1px solid var(--linha);border-top:1px solid var(--linha);text-transform:uppercase;letter-spacing:.02em}
.roteiro .dia:first-child{border-top:0}
.passo{width:100%;text-align:left;text-transform:none;letter-spacing:0;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--neutro-fundo);font-size:var(--t0);transition:background .1s}
.passo:hover{background:var(--gelo)}
.passo .bola{width:18px;height:18px;border-radius:50%;border:2px solid #CBD5E1;display:grid;place-items:center}
.passo .bola svg{width:11px;height:11px;display:none}
.passo .verbo{color:var(--marinho);font-weight:700}
.passo .nome{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;color:var(--texto)}
.passo .v{color:var(--texto-2)}
.passo.atual{background:var(--marinho)}
.passo.atual .verbo,.passo.atual .nome,.passo.atual .v{color:#fff}
.passo.atual .bola{border-color:#fff}
.passo[data-estado="FEITO"] .bola{background:var(--feito);border-color:var(--feito);color:#fff}
.passo[data-estado="FEITO"] .bola svg{display:block}
.passo[data-estado="FEITO"] .nome,.passo[data-estado="NAO_PROCEDE"] .nome{color:var(--texto-2);text-decoration:line-through;text-decoration-color:#CBD5E1}
.passo[data-estado="NAO_PROCEDE"] .bola{background:#CBD5E1;border-color:#CBD5E1}
.passo[data-estado="BLOQUEADO"] .bola{background:#F59E0B;border-color:#F59E0B}
.passo[data-estado="VALIDAR"] .bola{border-style:dashed;border-color:#F59E0B}

.da-vez{background:var(--papel);border:1px solid var(--linha);border-radius:8px;box-shadow:var(--sombra);padding:26px 28px;display:grid;gap:20px;min-width:0}
.da-vez .onde{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:var(--t0);color:var(--texto-2)}
.da-vez .verbo{display:inline-block;font-size:var(--t2);color:#fff;background:var(--marinho);padding:5px 14px;border-radius:4px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px}
.da-vez .verbo.validar{background:var(--alerta-fundo);color:var(--alerta)}
.da-vez h2{font-size:var(--t5);line-height:1.08;font-weight:700;text-transform:none;letter-spacing:0;text-wrap:balance}
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--linha);border-radius:6px}
.ficha>div{padding:12px 16px;border-right:1px solid var(--linha);min-width:0}
.ficha>div:last-child{border-right:0}
.ficha small{display:block;font-size:var(--t-1);color:var(--texto-2);text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px}
.ficha b{font-size:var(--t3);font-weight:700;line-height:1.15}
.ficha .apoio{font-size:var(--t0);color:var(--texto-2)}
.copiar{display:inline-flex;align-items:center;gap:8px;font-size:var(--t3);font-weight:700;text-transform:none;letter-spacing:0;color:var(--marinho);padding:0}
.copiar svg{width:18px;height:18px}
.copiar:hover{text-decoration:underline;text-underline-offset:4px}
.porque{display:grid;gap:8px;font-size:var(--t1)}
.porque blockquote{margin:0;padding:10px 14px;background:var(--fundo);border-radius:6px;color:var(--texto-2);font-size:var(--t0)}
.porque .fonte-da-prova{font-size:var(--t0);color:var(--texto-2)}
.decidir{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.decidir>div{display:grid;gap:6px;min-width:0}
.decidir button{height:64px;border-radius:6px;font-size:var(--t2);border:1px solid var(--linha);background:var(--papel);transition:background .12s,border-color .12s,transform .06s}
.decidir button:active{transform:scale(.985)}
.decidir button:hover{border-color:#94A3B8;background:var(--fundo)}
.decidir button.feito{background:var(--marinho);border-color:var(--marinho);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px}
.decidir button.feito:hover{background:var(--marinho-escuro)}
.decidir button.feito svg{width:24px;height:24px}
@media(max-width:700px){.decidir{grid-template-columns:minmax(0,1fr)}}
.marcado{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 16px;border-radius:6px;background:var(--feito-fundo);color:var(--feito);font-size:var(--t1)}
.marcado.np{background:var(--neutro-fundo);color:var(--neutro)}
.marcado.bl,.marcado.val{background:var(--alerta-fundo);color:var(--alerta)}
.marcado button{margin-left:auto;font-size:var(--t0);text-decoration:underline;text-underline-offset:3px}

.rodape{position:sticky;bottom:64px;margin-top:20px;background:var(--papel);border:1px solid var(--linha);border-radius:8px;box-shadow:var(--sombra);padding:12px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.rodape .resumo{flex:1 1 260px;min-width:0;font-size:var(--t0);color:var(--texto-2)}
.rodape .resumo b{color:var(--texto);font-size:var(--t1)}

/* um por vez */
.foco{max-width:980px;margin:0 auto;display:grid;gap:16px}
.dias{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.dias button{text-transform:none;letter-spacing:0;border:1px solid var(--linha);background:var(--papel);border-radius:6px;padding:8px 6px;display:grid;gap:2px;justify-items:center;font-size:var(--t-1);color:var(--texto-2)}
.dias button b{font-size:var(--t2);color:var(--texto);font-weight:700}
.dias button.pronto{background:var(--feito-fundo);border-color:var(--feito-fundo);color:var(--feito)}
.dias button.pronto b{color:var(--feito)}
.dias button.hoje{border-color:var(--marinho);box-shadow:0 0 0 2px var(--marinho)}
.dias button.sem{opacity:.5}
.depois{display:grid;gap:6px}
.depois .passo{background:var(--papel);border:1px solid var(--linha);border-radius:6px}
.navegar{display:flex;justify-content:space-between;gap:12px}

/* planilha */
.planilha{background:var(--papel);border:1px solid var(--linha);border-radius:8px;overflow-x:auto}
.planilha table{width:100%;border-collapse:collapse;font-size:var(--t0);min-width:900px}
.planilha th{text-align:left;font-weight:400;font-size:var(--t-1);color:var(--texto-2);text-transform:uppercase;letter-spacing:.02em;padding:10px 12px;background:var(--fundo);border-bottom:1px solid var(--linha);position:sticky;top:0}
.planilha td{padding:9px 12px;border-bottom:1px solid var(--neutro-fundo);vertical-align:middle}
.planilha tr.g td{background:var(--fundo);color:var(--texto-2);font-size:var(--t-1);text-transform:uppercase;letter-spacing:.02em;padding:7px 12px}
.planilha tr.l{cursor:pointer;transition:background .1s}
.planilha tr.l:hover{background:var(--gelo)}
.planilha tr.l.atual{background:var(--gelo-forte)}
.planilha tr.l.atual td{font-size:var(--t1);padding-block:14px}
.planilha tr.l.atual .nome-item{font-size:var(--t2);font-weight:700}
.planilha tr.l[data-estado="FEITO"] td,.planilha tr.l[data-estado="NAO_PROCEDE"] td{color:var(--texto-2)}
.planilha .verbo{color:var(--marinho);font-weight:700;white-space:nowrap}
.planilha tr.x td{background:var(--gelo);padding:0 12px 16px}
.planilha tr.x .porque{max-width:860px;padding-top:4px}
.planilha .d{white-space:nowrap;text-align:right}
.planilha .a{text-align:right;white-space:nowrap}

/* painel */
.filtros{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.filtros label{display:grid;gap:4px;font-size:var(--t-1);color:var(--texto-2);text-transform:uppercase;letter-spacing:.02em}
.filtros .campo{height:42px;min-width:190px;padding:0 12px;border:1px solid var(--linha);border-radius:6px;background:var(--papel);display:flex;align-items:center;font-size:var(--t0);color:var(--texto);text-transform:none;letter-spacing:0}
.faixa.quatro{grid-template-columns:repeat(4,minmax(0,1fr))}
.faixa .apoio{font-size:var(--t-1);color:var(--texto-2)}
@media(max-width:900px){.faixa.quatro{grid-template-columns:repeat(2,minmax(0,1fr))}}
.blocos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:1000px){.blocos{grid-template-columns:minmax(0,1fr)}}
.bloco{background:var(--papel);border:1px solid var(--linha);border-radius:8px;padding:18px 20px;min-width:0}
.bloco h2{font-size:var(--t1);font-weight:700;margin-bottom:2px}
.bloco .sub{font-size:var(--t-1);color:var(--texto-2);margin-bottom:14px}
.barras{display:grid;gap:10px}
.barra{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:var(--t0);padding:3px 6px;border-radius:4px;transition:background .1s}
.barra:hover{background:var(--gelo)}
.barra .t{height:14px;border-radius:3px;background:var(--neutro-fundo);overflow:hidden}
.barra .t i{display:block;height:100%;background:var(--marinho);border-radius:3px}
.barra .q{text-align:right;color:var(--texto-2)}
.bloco table{width:100%;border-collapse:collapse;font-size:var(--t0)}
.bloco th{text-align:right;font-weight:400;font-size:var(--t-1);color:var(--texto-2);padding:6px 8px;text-transform:uppercase;letter-spacing:.02em}
.bloco th:first-child,.bloco td:first-child{text-align:left}
.bloco td{text-align:right;padding:9px 8px;border-top:1px solid var(--neutro-fundo)}
.bloco tbody tr:hover{background:var(--gelo)}
.grafico{width:100%;height:auto;display:block}
.grafico .ponto{cursor:default}
.grafico .ponto circle{fill:var(--papel);stroke:var(--marinho);stroke-width:2;transition:r .1s}
.grafico .ponto:hover circle{r:7;fill:var(--marinho)}
.grafico .ponto text{opacity:0;transition:opacity .1s;fill:var(--texto);font-size:13px}
.grafico .ponto:hover text,.grafico .ponto.ultimo text{opacity:1}
.grafico .eixo{fill:var(--texto-2);font-size:12px}

/* barra do protótipo */
.proto{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:#0F172A;color:#fff;border-radius:999px;padding:6px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;box-shadow:0 12px 30px rgba(0,0,0,.35);max-width:calc(100vw - 24px)}
.proto .g{display:flex;gap:2px;background:#1E293B;border-radius:999px;padding:3px}
.proto button{color:#CBD5E1;font-size:13px;padding:7px 13px;border-radius:999px;white-space:nowrap}
.proto button[aria-pressed="true"]{background:#fff;color:#0F172A;font-weight:700}
.aviso{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--marinho-escuro);color:#fff;padding:10px 16px;border-radius:6px;font-size:var(--t0);z-index:90;box-shadow:var(--sombra)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* PROTÓTIPO DESCARTÁVEL. Dados inventados. Três telas (Fila, Conta aberta, Painel); a Fila tem 2 variantes e a Conta aberta tem 3. */
(function(){
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I={
  busca:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  copiar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  caixa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>',
  subir:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5M7 9.5L12 5l5 4.5M5 19h14"/></svg>'
};

/* ---------- dados inventados ---------- */
let semente=20261118; const rnd=()=>{semente|=0;semente=semente+0x6D2B79F5|0;let t=Math.imul(semente^semente>>>15,1|semente);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const escolhe=a=>a[Math.floor(rnd()*a.length)];
const PRIMEIROS=['Antônia','Benedito','Célia','Davi','Elza','Fábio','Glória','Heitor','Iara','Jonas','Lúcia','Mauro','Neusa','Otávio','Paula','Rui','Sônia','Tadeu','Vera','Wagner'];
const INICIAIS='ABCDFGLMNPRST';
const OPERADORAS=['ASSIM','Unimed','Leve','Amil','Porto'];
const EQUIPE=['Lia','Nara','Taís']; const EU='Lia';
const MESES={'2026-09':'Setembro','2026-10':'Outubro','2026-11':'Novembro'};
const contas=[]; let serie=302690;
function nova(etapa,extra){
  serie+=1+Math.floor(rnd()*4); if(String(serie).includes('2775'))serie+=1;
  const total=6+Math.floor(rnd()*30);
  const c=Object.assign({n:String(serie),p:escolhe(PRIMEIROS)+' '+escolhe(INICIAIS.split(''))+'.',op:escolhe(OPERADORAS),total,feitos:0,etapa,com:null,pend:false,comp:'2026-11',per:'03/11 a 09/11'},extra||{});
  contas.push(c); return c;
}
const periodo=(mes,i)=>{const d=mes==='11'?1+i%10:1+(i*3)%22;const f=n=>String(n).padStart(2,'0');return f(d)+'/'+mes+' a '+f(d+6)+'/'+mes};
for(let i=0;i<18;i++)nova('arquivada',{comp:'2026-09',per:periodo('09',i),com:escolhe(EQUIPE),feitos:-1});
for(let i=0;i<28;i++)nova('concluida',{comp:'2026-10',per:periodo('10',i),com:escolhe(EQUIPE),feitos:-1,pend:rnd()<.2});
for(let i=0;i<12;i++)nova('concluida',{comp:'2026-11',per:periodo('11',i),com:escolhe(EQUIPE),feitos:-1,pend:rnd()<.2});
[['Lia',.4],['Nara',.7],['Taís',.2],['Nara',.1],['Taís',.55]].forEach(([q,f],i)=>{const c=nova('analise',{com:q,per:periodo('11',i+2)});c.feitos=Math.round(c.total*f)});
for(let i=0;i<34;i++)nova('fila',{per:periodo('11',i)});
nova('envio',{sit:'Processando, IA lendo o prontuário, faltam cerca de 6 min',total:0});
nova('envio',{sit:'Na fila, começa em cerca de 9 min',total:0});
nova('envio',{sit:'Falta enviar o prontuário',total:0,alerta:true});
contas.forEach(c=>{if(c.feitos<0)c.feitos=c.total});
const aberta={n:'302775',p:'Antônia F.',op:'ASSIM',total:14,feitos:0,etapa:'analise',com:EU,pend:false,comp:'2026-11',per:'03/11 a 09/11'};
contas.push(aberta);

const L=(dia,setor,acao,nome,cod,qtd,apoio,per,valor,motivo,pag,nivel,trecho,estado)=>({dia,setor,acao,nome,cod,qtd,apoio,per,valor,motivo,pag,nivel,trecho,estado:estado||'ABERTA'});
const linhas=[
 L('03/11','Emergência adulto','Incluir','Cloreto de sódio 0,9% 500 ml','90214417','2 a mais','na conta 1, o certo é 3','03/11','+ R$ 18,40','Prescrito três vezes no dia e lançado uma.',41,'Registrado','SF 0,9% 500 ml EV, correr em 4 h. Checado 09:10, 14:05 e 21:30.','FEITO'),
 L('03/11','Emergência adulto','Incluir','Equipo macrogotas','70401162','2 a mais','na conta 1, o certo é 3','03/11','+ R$ 9,80','Um equipo por frasco de soro instalado.',41,'Por regra','Três instalações de soro no dia, um equipo lançado.','FEITO'),
 L('03/11','Emergência adulto','Corrigir preço','Agulha descartável 40x12','70118834','6 unidades','preço da coluna errada','03/11','+ R$ 2,10','O preço lançado é o da coluna Comum; o plano é Carioca.',null,null,null,'FEITO'),
 L('04/11','Enfermaria 3','Incluir','Pantoprazol 40 mg injetável','90551208','3 a mais','na conta 3, o certo é 6','04/11 a 09/11','+ R$ 96,30','Prescrito todos os dias do período e lançado só em três.',118,'Prescrito','Pantoprazol 40 mg EV 1x ao dia, 06h. Prescrição de 04/11 a 09/11.','FEITO'),
 L('04/11','Enfermaria 3','Ajustar quantidade','Dipirona 1 g injetável','90117730','de 4 para 6','faltam 2','04/11','+ R$ 7,60','Seis horários checados na anotação de enfermagem.',121,'Registrado','Dipirona 1 g EV 6/6 h. Checado 00h, 06h, 12h, 18h; SN 15h e 21h.','FEITO'),
 L('04/11','Enfermaria 3','Incluir','Insulina regular, unidade','90330951','8 unidades','se necessário','04/11','+ R$ 12,00','Prescrita se necessário conforme glicemia, com duas glicemias acima do corte.',124,'Prescrito SN','HGT 22h: 268 mg/dl. Insulina regular conforme esquema.'),
 L('05/11','Enfermaria 3','Incluir','Fita para glicemia capilar','70602215','6 a mais','na conta 2, o certo é 8','05/11 a 06/11','+ R$ 21,00','Oito glicemias registradas em dois dias.',139,'Registrado','HGT 06h 142, 11h 201, 17h 188, 22h 173.'),
 L('05/11','Enfermaria 3','Incluir','Lanceta descartável','70602231','6 a mais','na conta 2, o certo é 8','05/11 a 06/11','+ R$ 4,80','Uma lanceta por glicemia.',139,'Por regra','Oito glicemias registradas no período.'),
 L('05/11','Enfermaria 3','Retirar','Ondansetrona 8 mg injetável','90447126','1 unidade','sem registro no prontuário','05/11','- R$ 14,90','Lançada na conta sem prescrição nem checagem neste dia.',null,null,null),
 L('06/11','Enfermaria 3','Ajustar quantidade','Oxigênio por cateter, hora','80010042','de 10 para 24','faltam 14 horas','06/11','+ R$ 61,60','Cateter nasal a 2 l/min o dia inteiro, conforme anotação.',156,'Registrado','Mantido em O2 por cateter nasal 2 l/min nas 24 h.'),
 L('06/11','Enfermaria 3','Incluir','Seringa descartável 10 ml','70118902','4 a mais','na conta 2, o certo é 6','06/11','+ R$ 3,20','Uma seringa por medicação venosa aplicada.',157,'Por regra','Seis aplicações venosas checadas no dia.'),
 L('07/11','Enfermaria 3','Validar','Diária de enfermaria','60000518','1 diária','em validação','07/11','R$ 412,00 em jogo','Transferência de setor sem hora exata: a regra precisa de decisão da gestão.',171,'Registrado','Transferido para a enfermaria no período da manhã.','VALIDAR'),
 L('08/11','Enfermaria 3','Incluir','Curativo filme transparente','70733409','1 a mais','na conta 0, o certo é 1','08/11','+ R$ 16,50','Troca de curativo do acesso registrada.',188,'Registrado','Realizada troca do curativo do acesso periférico com filme transparente.'),
 L('09/11','Enfermaria 3','Incluir','Cloreto de sódio 0,9% 10 ml, ampola','90214452','5 a mais','na conta 1, o certo é 6','09/11','+ R$ 5,50','Diluição de seis medicações venosas no dia.',203,'Por regra','Seis medicações venosas com diluição em SF 0,9% 10 ml.')
].map((l,i)=>Object.assign(l,{id:i}));
aberta.total=linhas.length;aberta.feitos=linhas.filter(l=>l.estado!=='ABERTA').length;
const DIAS=['03/11','04/11','05/11','06/11','07/11','08/11','09/11'];
const fechada=l=>l.estado!=='ABERTA';
const proximaAberta=de=>{for(let k=1;k<=linhas.length;k++){const l=linhas[(de+k)%linhas.length];if(!fechada(l))return l.id}return de};

/* ---------- estado ---------- */
const S={tela:'fila',vFila:'A',vConta:'A',etapa:'fila',quem:'todas',busca:'',legendas:true,confirma:null,soltar:false,atual:proximaAberta(-1)};
const VAR={fila:[['A','Lista com esteira'],['B','Quadro por etapa']],conta:[['A','Mesa de trabalho'],['B','Um item por vez'],['C','Planilha']],painel:[['A','Painel']]};
const chaveVar=()=>S.tela==='fila'?'vFila':'vConta';

function avisar(t){const a=$('#aviso');a.textContent=t;a.hidden=false;clearTimeout(avisar.r);avisar.r=setTimeout(()=>a.hidden=true,2200)}

/* ---------- casca ---------- */
function casca(){
  $('#casca').classList.toggle('com-legendas',S.legendas);
  $('#subnav').innerHTML=[['fila','Contas'],['painel','Painel'],['x','Validação'],['x','Coordenação'],['x','Contratos'],['x','Operadoras'],['x','Habilitação']]
   .map(([t,r])=>t==='x'?`<button disabled data-dica="Fora deste protótipo. No app, cada pessoa vê só as telas da permissão dela.">${r}</button>`
   :`<button data-ir="${t}" class="${(S.tela===t||(t==='fila'&&S.tela==='conta'))?'ativo':''}">${r}</button>`).join('');
  $('#p-telas').innerHTML=[['fila','Fila'],['conta','Conta aberta'],['painel','Painel']].map(([t,r])=>`<button data-ir="${t}" aria-pressed="${S.tela===t}">${r}</button>`).join('');
  const vs=VAR[S.tela]; const atual=S.tela==='painel'?'A':S[chaveVar()];
  $('#p-variantes').innerHTML=vs.map(([k,r])=>`<button data-var="${k}" aria-pressed="${atual===k}">${vs.length>1?k+', ':''}${r}</button>`).join('');
  $('#p-variantes').hidden=vs.length<2;
}
function render(){casca();({fila:telaFila,conta:telaConta,painel:telaPainel})[S.tela]();}

/* ---------- FILA ---------- */
const ETAPAS=[['envio','Envios','Contas que subiram e ainda estão sendo lidas. Quando ficam prontas, entram na Fila sozinhas.'],
 ['fila','Fila','Contas prontas que ninguém pegou, em ordem de envio. Quem abre uma conta fica com ela.'],
 ['analise','Em análise','Contas que alguém abriu e ainda não concluiu. O nome ao lado diz com quem está.'],
 ['concluida','Concluídas','Contas que já passaram pela análise. Depois de lançar tudo no MV, arquive para limpar a esteira.'],
 ['arquivada','Arquivadas','Contas já tratadas no MV, fora da esteira. Continuam no Painel e dá para desarquivar.']];
const daPessoa=c=>S.quem==='todas'||c.com===EU||c.etapa==='fila'||c.etapa==='envio';
const naEtapa=e=>contas.filter(c=>c.etapa===e&&daPessoa(c));
function marca(txt){const b=S.busca.trim();if(!b)return esc(txt);const i=txt.toLowerCase().indexOf(b.toLowerCase());return i<0?esc(txt):esc(txt.slice(0,i))+'<mark>'+esc(txt.slice(i,i+b.length))+'</mark>'+esc(txt.slice(i+b.length))}
const pessoa=q=>q?`<span class="pessoa ${q===EU?'eu':''}"><i>${q[0]}</i>${q===EU?'Você':q}</span>`:'<span class="apoio">ninguém ainda</span>';
function situacao(c){
  if(c.etapa==='envio')return `<span class="pilula ${c.alerta?'alerta':'azul'}">${c.alerta?'Falta arquivo':'Processando'}</span>`;
  if(c.etapa==='fila')return '<span class="pilula">Livre</span>';
  if(c.etapa==='analise')return '<span class="pilula azul">Em análise</span>';
  if(c.etapa==='arquivada')return '<span class="pilula">Arquivada</span>';
  return c.pend?'<span class="pilula alerta" data-dica="Concluída com item em validação ou bloqueado. Pode voltar para a faturista.">Com pendência</span>':'<span class="pilula ok">Concluída</span>';
}
function acoes(c){
  if(c.etapa==='envio')return '';
  if(c.etapa==='fila')return `<button class="mini forte so-no-hover dica-dir" data-abrir="${c.n}" data-dica="Abrir faz a conta ser sua. Só uma pessoa fica com cada conta.">Abrir</button>`;
  if(c.etapa==='analise')return c.com===EU?`<button class="mini forte" data-abrir="${c.n}">Continuar</button>`:`<button class="mini so-no-hover dica-dir" data-ver="${c.n}" data-dica="Está com ${c.com}. Você pode ver, sem marcar nada.">Ver</button>`;
  if(c.etapa==='concluida')return `<button class="mini so-no-hover dica-dir" data-arquivar="${c.n}" data-dica="Arquivar tira a conta da esteira. Use quando ela já foi lançada no MV.">Arquivar</button><button class="mini so-no-hover" data-ver="${c.n}">Ver</button>`;
  return `<button class="mini so-no-hover" data-desarquivar="${c.n}">Desarquivar</button>`;
}
function linhaDaConta(c){
  const prog=c.etapa==='envio'?`<span class="apoio">${esc(c.sit)}</span>`
   :c.etapa==='fila'?`<span class="apoio num">${c.total} itens a conferir</span>`
   :`<span class="progresso num"><span class="trilho"><i style="width:${Math.round(c.feitos/c.total*100)}%"></i></span>${c.feitos} de ${c.total}</span>`;
  return `<div class="linha" role="row">
    <div class="quem-e"><span class="n num">${marca(c.n)}</span><span class="p">${marca(c.p)}</span></div>
    <div class="c-op apoio">${c.op}</div><div class="c-per apoio num">${c.per}</div>
    <div>${prog}</div><div>${c.etapa==='fila'||c.etapa==='envio'?situacao(c):pessoa(c.com)}</div>
    <div class="acoes">${acoes(c)}</div></div>`;
}
const CAB='<div class="cab caixa" role="row"><div>Atendimento e paciente</div><div>Operadora</div><div>Período da conta</div><div>Andamento</div><div>Com quem</div><div></div></div>';
function barraDaFila(){
  return `<div class="ferramentas">
    <div class="busca">${I.busca}<input id="campo-busca" type="search" autocomplete="off" placeholder="Buscar pelo número do atendimento ou pelo paciente" aria-label="Buscar conta" value="${esc(S.busca)}"></div>
    <div class="segmento" role="group" aria-label="De quem são as contas"><button data-quem="todas" aria-pressed="${S.quem==='todas'}">Todas</button><button data-quem="minhas" aria-pressed="${S.quem==='minhas'}" data-dica="Só as contas que você abriu: as que está fazendo e as que já concluiu.">Minhas</button></div>
    <span style="flex:1"></span>
    <button class="botao" data-soltar>${I.subir}Enviar contas</button>
    <button class="interruptor dica-dir" role="switch" aria-checked="${S.legendas}" data-legendas data-dica="Mostra uma frase explicando cada parte da tela. Quem já conhece pode desligar."><i></i>Legendas</button>
  </div>
  ${S.soltar?'<div class="soltar"><b>Arraste aqui a conta e o prontuário do MV</b>Vários de uma vez, sem renomear. O app lê o tipo e o atendimento dentro de cada PDF.</div>':''}`;
}

function passo(l,opts){return `<button class="passo ${l.id===S.atual&&!(opts&&opts.semAtual)?'atual':''}" data-item="${l.id}" data-estado="${l.estado}"><span class="bola">${I.ok}</span><span><span class="verbo">${l.acao}</span> <span class="nome">${esc(l.nome)}</span></span><span class="v num">${l.valor.replace(' em jogo','')}</span></button>`}

      corpo+=`<tr class="l ${at?'atual':''}" data-item="${x.id}" data-estado="${x.estado}"><td class="verbo">${x.acao}</td><td><span class="nome-item">${esc(x.nome)}</span></td><td><button class="copiar num" style="font-size:inherit" data-copiar="${x.cod}">${x.cod}</button></td><td class="num">${esc(x.qtd)}</td><td class="num">${x.per}</td><td class="d num">${x.valor.replace(' em jogo','')}</td><td class="a">${estado}</td></tr>`;

    });

}

function marcar(id,estado){const l=linhas[id];l.estado=estado;aberta.feitos=linhas.filter(fechada).length;
  if(estado==='ABERTA'){S.atual=id}else{avisar(VERBO_FRASE[estado]);S.atual=proximaAberta(id)}
  telaConta();}
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t)return; const d=t.dataset;
  if(d.ir){S.tela=d.ir;S.busca='';render();window.scrollTo(0,0);return}
  if(d.var){S[chaveVar()]=d.var;render();return}
  if('legendas' in d){S.legendas=!S.legendas;render();return}
  if(d.quem){S.quem=d.quem;telaFila();return}
  if(d.etapa){S.etapa=d.etapa;S.confirma=null;corpoFila();return}
  if('soltar' in d){S.soltar=!S.soltar;telaFila();return}
  if(d.abrir||d.ver){S.tela='conta';S.busca='';render();window.scrollTo(0,0);if((d.abrir||d.ver)!=='302775')avisar('No protótipo, toda conta abre a 302775.');return}
  if(d.arquivar){const c=contas.find(x=>x.n===d.arquivar);c.etapa='arquivada';avisar('Conta '+c.n+' arquivada.');corpoFila();return}
  if(d.desarquivar){const c=contas.find(x=>x.n===d.desarquivar);c.etapa='concluida';avisar('Conta '+c.n+' voltou para as Concluídas.');corpoFila();return}
  if(d.lote){S.confirma=S.confirma===d.lote?null:d.lote;corpoFila();return}
  if('loteNao' in d){S.confirma=null;corpoFila();return}
  if(d.loteOk){const l=contas.filter(c=>c.etapa==='concluida'&&c.comp===d.loteOk&&daPessoa(c));l.forEach(c=>c.etapa='arquivada');S.confirma=null;avisar(l.length+' contas arquivadas.');corpoFila();return}
  if('loteQuadro' in d){S.vFila='A';S.etapa='concluida';S.confirma='2026-10';render();return}
  if(d.copiar){e.stopPropagation();const ok=()=>avisar('Código '+d.copiar+' copiado. Cole no MV.');try{navigator.clipboard.writeText(d.copiar).then(ok,ok)}catch(_){ok()}return}
  if(d.marcarDireto){marcar(+d.item,d.marcarDireto);return}
  if(d.marcar){marcar(S.atual,d.marcar);return}
  if(d.item){S.atual=+d.item;telaConta();return}
  if(d.dia){const l=linhas.find(x=>x.dia===d.dia&&!fechada(x))||linhas.find(x=>x.dia===d.dia);if(l){S.atual=l.id;telaConta()}return}
  if(d.anda){S.atual=(S.atual+ +d.anda+linhas.length)%linhas.length;telaConta();return}
  if('concluir' in d){avisar('Conta concluída. No app, a próxima da Fila abriria agora.');return}
});
document.addEventListener('click',e=>{const tr=e.target.closest('tr.l');if(tr&&!e.target.closest('button')){S.atual=+tr.dataset.item;telaConta()}});
document.addEventListener('input',e=>{if(e.target.id==='campo-busca'){S.busca=e.target.value;corpoFila()}});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,[contenteditable]'))return;
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const vs=VAR[S.tela];if(vs.length<2)return;const k=chaveVar();const i=vs.findIndex(v=>v[0]===S[k]);
  S[k]=vs[(i+(e.key==='ArrowRight'?1:-1)+vs.length)%vs.length][0];render();
});
render();
})();
</script>
