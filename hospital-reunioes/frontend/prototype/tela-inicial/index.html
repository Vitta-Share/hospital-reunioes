      a.addEventListener("click", function (e) { e.preventDefault(); });
      m.appendChild(a);
    });
  }

  function desenharControles() {
    var c = document.getElementById("controles");
    c.textContent = "";
    CONTROLES.forEach(function (ctl) {
      var fs = el("fieldset");
      fs.appendChild(el("legend", null, ctl.legenda));
      var seg = el("div", "seg");
      ctl.opcoes.forEach(function (o) {
        var b = el("button", null, o[1]);
        b.type = "button";
        b.setAttribute("aria-pressed", String(estado[ctl.chave] === o[0]));
        b.addEventListener("click", function () {
          estado[ctl.chave] = o[0];
          if (ctl.chave === "pessoa" || ctl.chave === "situacao") { estado.feitos = {}; estado.fichaAberta = null; }
          desenhar(true);
        });
        seg.appendChild(b);
      });
      fs.appendChild(seg);
      c.appendChild(fs);
    });
  }

  function desenhar(redesenharControles) {
    var p = PESSOAS[estado.pessoa];
    var itens = itensDaPessoa();
    var raiz = document.getElementById("raiz");
    raiz.className = "moldura mov-" + estado.movimento + (estado.fonte ? " mostra-fonte" : "");
    desenharMenu(p);
    desenharAbertura(p, itens);
    desenharFila(p, itens);
    desenharTrilho(p);
    desenharLiderados(p);
    if (redesenharControles) desenharControles();
  }

  desenhar(true);
})();
</script>
