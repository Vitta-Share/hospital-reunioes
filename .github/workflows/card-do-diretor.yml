# Card do diretor (grill de 24/11/2026, skill /setup-diretor).
#
# O diretor planeja no Claude dele e abre o card no GitHub, mas não é colaborador do
# repositório: trabalha num fork, para o GitHub impedir que ele mergeie qualquer coisa
# (repo de conta pessoal não tem papel Triage; todo colaborador é Write). Sem acesso,
# ele não consegue pôr label nem dono. Esta Action faz isso por ele: quando a issue
# abre por um login da variável DIRETOR_LOGINS (lista separada por vírgula), põe
# needs-triage + origem:diretor e, se a issue nasceu sem dono, designa o Pedro
# (pedrorezendefig), que faz o grill técnico (/grill-with-docs #N). O dono do
# repositório é a organização Vitta-Share desde a issue #2303, e organização não
# pode ser designada: por isso o login vai fixo.
#
# Desde a ADR 0113 (decisão 2) o diretor é colaborador e pode abrir o card já no nome
# de quem vai desenvolver: a Action relê os assignees e mantém esse dono. A
# dono-do-card.yml pula o login do diretor, então as duas não brigam.
#
# Só lê login e número do evento; título e corpo da issue nunca entram em comando.
name: Card do diretor

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  card:
    if: github.event.issue.user.type != 'Bot' && vars.DIRETOR_LOGINS != ''
    runs-on: ubuntu-latest
    steps:
      - name: Labels e dono do card que o diretor abriu
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DIRETOR_LOGINS: ${{ vars.DIRETOR_LOGINS }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const socio = 'pedrorezendefig';
            const issue_number = context.payload.issue.number;
            const autor = context.payload.issue.user.login.toLowerCase();
            const diretores = process.env.DIRETOR_LOGINS.split(',')
              .map((l) => l.trim().toLowerCase())
              .filter(Boolean);
            if (!diretores.includes(autor)) {
              core.info(`#${issue_number}: ${autor} não está em DIRETOR_LOGINS`);
              return;
            }
            await github.rest.issues.addLabels({
              owner, repo, issue_number, labels: ['needs-triage', 'origem:diretor'],
            });
            const { data: atual } = await github.rest.issues.get({ owner, repo, issue_number });
            if (atual.assignees.length > 0) {
              core.info(`#${issue_number}: card do diretor, já tem dono: ${atual.assignees.map((a) => a.login).join(', ')}`);
              return;
            }
            await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [socio] });
            core.info(`#${issue_number}: card do diretor, needs-triage + origem:diretor, dono ${socio}`);
