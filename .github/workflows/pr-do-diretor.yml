# PR do diretor (ADR 0113, decisão 2; issue #2269).
#
# O diretor é colaborador do repositório para receber e fechar card, mas não pode
# mergear. Este check é uma das duas travas: o PR aberto por um login da variável
# DIRETOR_LOGINS (lista separada por vírgula) reprova enquanto não tem a label
# `assumido`, que um Desenvolvedor põe quando assume o protótipo (decisão 3). A outra
# trava é o /setup-diretor, que nega o merge no Claude dele. O check só segura o
# merge depois de virar obrigatório no ruleset da main, numa fatia humana à parte.
#
# Roda de novo quando a label entra ou sai e a cada push. O PR vem do fork, por isso
# o gatilho é pull_request_target (o evento do fork não recebe a variável e espera
# aprovação para rodar): o job decide só pelo login do autor e pelas labels do evento,
# sem checkout, sem token com permissão e sem ler título nem corpo do PR.
name: PR do diretor

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

jobs:
  assumido:
    name: PR do diretor assumido
    runs-on: ubuntu-latest
    steps:
      - name: Reprovar o PR do diretor sem a label assumido
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DIRETOR_LOGINS: ${{ vars.DIRETOR_LOGINS }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const autor = pr.user.login.toLowerCase();
            const diretores = (process.env.DIRETOR_LOGINS || '').split(',')
              .map((l) => l.trim().toLowerCase())
              .filter(Boolean);
            if (!diretores.includes(autor)) {
              core.info(`#${pr.number}: ${autor} não está em DIRETOR_LOGINS`);
              return;
            }
            if (pr.labels.some((l) => l.name === 'assumido')) {
              core.info(`#${pr.number}: PR do diretor assumido por um Desenvolvedor`);
              return;
            }
            core.setFailed(
              `#${pr.number}: PR do diretor sem a label assumido. ` +
              'Um Desenvolvedor assume, continua na mesma branch e põe a label (ADR 0113).',
            );
